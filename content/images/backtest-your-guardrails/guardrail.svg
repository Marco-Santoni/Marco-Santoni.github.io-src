<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#12224a"/>
      <stop offset="100%" stop-color="#070e22"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b6b8c"/>
    </marker>
    <g id="ok"><circle r="14" fill="#7fe3ff"/></g>
    <g id="atk"><path d="M0,-18 L18,0 L0,18 L-18,0 Z" fill="#ff6b7a"/></g>
    <g id="fp">
      <circle r="24" fill="none" stroke="#ffd166" stroke-width="3" opacity="0.9"/>
      <circle r="14" fill="#7fe3ff"/>
    </g>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Headline -->
  <text x="80" y="140" fill="#ffffff" font-size="54" font-weight="700">A guardrail is a classifier.</text>
  <text x="80" y="192" fill="#94a3b8" font-size="30">It makes mistakes in both directions.</text>

  <!-- Flow band -->
  <rect x="60" y="345" width="960" height="190" rx="95" fill="#7fe3ff" opacity="0.04"/>

  <!-- Incoming prompts -->
  <text x="250" y="320" fill="#94a3b8" font-size="24" text-anchor="middle" letter-spacing="2">PROMPTS</text>
  <g opacity="0.45">
    <use href="#ok" x="100" y="380"/><use href="#ok" x="100" y="440"/><use href="#ok" x="100" y="500"/>
  </g>
  <g opacity="0.75">
    <use href="#ok" x="160" y="380"/><use href="#ok" x="160" y="440"/><use href="#ok" x="160" y="500"/>
  </g>
  <use href="#atk" x="220" y="380"/><use href="#ok" x="220" y="440"/><use href="#ok" x="220" y="500"/>
  <use href="#ok" x="280" y="380"/><use href="#ok" x="280" y="440"/><use href="#ok" x="280" y="500"/>
  <use href="#ok" x="340" y="380"/><use href="#ok" x="340" y="440"/><use href="#atk" x="340" y="500"/>
  <use href="#ok" x="400" y="380"/><use href="#ok" x="400" y="440"/><use href="#ok" x="400" y="500"/>

  <line x1="432" y1="440" x2="488" y2="440" stroke="#5b6b8c" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Guardrail gate -->
  <text x="520" y="295" fill="#c4b5fd" font-size="24" text-anchor="middle" letter-spacing="2">GUARDRAIL</text>
  <rect x="500" y="320" width="40" height="240" rx="12" fill="#8b5cf6" filter="url(#glow)"/>
  <g stroke="#0b1530" stroke-width="4">
    <line x1="508" y1="368" x2="532" y2="368"/>
    <line x1="508" y1="416" x2="532" y2="416"/>
    <line x1="508" y1="464" x2="532" y2="464"/>
    <line x1="508" y1="512" x2="532" y2="512"/>
  </g>

  <line x1="552" y1="440" x2="578" y2="440" stroke="#5b6b8c" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Allowed prompts -->
  <use href="#ok" x="610" y="380"/><use href="#ok" x="610" y="440"/><use href="#ok" x="610" y="500"/>
  <use href="#ok" x="670" y="380"/><use href="#ok" x="670" y="440"/><use href="#ok" x="670" y="500"/>
  <use href="#ok" x="730" y="380"/><use href="#ok" x="730" y="440"/><use href="#ok" x="730" y="500"/>
  <use href="#atk" x="790" y="380"/><use href="#ok" x="790" y="440"/><use href="#ok" x="790" y="500"/>
  <circle cx="790" cy="380" r="30" fill="none" stroke="#ff6b7a" stroke-width="2.5" stroke-dasharray="6 6"/>
  <text x="790" y="328" fill="#ff8a95" font-size="22" text-anchor="middle">missed</text>

  <line x1="822" y1="440" x2="852" y2="440" stroke="#5b6b8c" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- LLM -->
  <rect x="862" y="370" width="150" height="140" rx="24" fill="#13233f" stroke="#7fe3ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="937" y="452" fill="#ffffff" font-size="36" font-weight="700" text-anchor="middle">LLM</text>

  <!-- Blocked -->
  <line x1="520" y1="572" x2="520" y2="662" stroke="#5b6b8c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="540" y="625" fill="#94a3b8" font-size="24" letter-spacing="2">BLOCKED</text>

  <use href="#atk" x="360" y="720"/>
  <text x="360" y="775" fill="#ff8a95" font-size="22" text-anchor="middle">stopped</text>

  <use href="#fp" x="460" y="720"/>
  <use href="#fp" x="530" y="720"/>
  <use href="#fp" x="600" y="720"/>
  <use href="#fp" x="670" y="720"/>
  <use href="#fp" x="740" y="720"/>

  <path d="M436,764 L436,778 L764,778 L764,764" fill="none" stroke="#ffd166" stroke-width="2.5"/>
  <text x="600" y="822" fill="#ffd166" font-size="32" font-weight="700" text-anchor="middle">blocked, but legitimate</text>
  <text x="600" y="858" fill="#94a3b8" font-size="22" text-anchor="middle">the error nobody files a ticket for</text>

  <!-- Legend -->
  <g font-size="22" fill="#94a3b8">
    <use href="#ok" x="96" y="952"/>
    <text x="122" y="960">legitimate prompt</text>
    <use href="#atk" x="340" y="952"/>
    <text x="368" y="960">attack</text>
  </g>
  <text x="1000" y="960" fill="#5b6b8c" font-size="22" text-anchor="end">marcosantoni.com</text>
</svg>
